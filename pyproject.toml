[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-linux-security-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "psutil>=5.9,<8",
    "scikit-learn>=1.8,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4,<5",
    "matplotlib>=3.8,<4",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/security_agent"]
addopts = "-q"
markers = [
    "model_integration: invokes a configured local model artifact",
]
